<!-- BARRA LATERAL (navegação + ações) -->
<aside class="sidebar" [class.collapsed]="collapsed">
  <div class="sidebar-brand drag">
    <mat-icon class="brand-icon">auto_awesome</mat-icon>
    @if (!collapsed) {
      <span class="brand-name">ActiveSync<span class="brand-ai">AI</span></span>
    }
  </div>

  <nav class="nav">
    <a class="nav-item" routerLink="/dashboard" routerLinkActive="active"
       [matTooltip]="collapsed ? 'Dashboard' : ''" matTooltipPosition="right">
      <mat-icon>space_dashboard</mat-icon>
      @if (!collapsed) {
        <span class="nav-text"><span class="nav-title">Dashboard</span><span class="nav-sub">Visão geral</span></span>
      }
    </a>

    @if (!collapsed) { <div class="nav-section">Shopify</div> } @else { <div class="nav-divider"></div> }

    <button class="nav-item" (click)="openSupridesMapeamento()"
            [matTooltip]="collapsed ? 'Coleções Shopify' : ''" matTooltipPosition="right">
      <mat-icon>cloud_upload</mat-icon>
      @if (!collapsed) { <span class="nav-title">Coleções</span> }
    </button>
    <button class="nav-item" (click)="openSupridesMargens()"
            [matTooltip]="collapsed ? 'Margens B2C' : ''" matTooltipPosition="right">
      <mat-icon>percent</mat-icon>
      @if (!collapsed) { <span class="nav-title">Margens B2C</span> }
    </button>
    <button class="nav-item" (click)="openCampaigns()"
            [matTooltip]="collapsed ? 'Campanhas' : ''" matTooltipPosition="right">
      <mat-icon>local_offer</mat-icon>
      @if (!collapsed) { <span class="nav-title">Campanhas</span> }
    </button>

    @if (!collapsed) { <div class="nav-section">Catálogo</div> } @else { <div class="nav-divider"></div> }

    <button class="nav-item" (click)="openFiltrosTags()"
            [matTooltip]="collapsed ? 'Gestão de Tags' : ''" matTooltipPosition="right">
      <mat-icon>sell</mat-icon>
      @if (!collapsed) { <span class="nav-title">Gestão de Tags</span> }
    </button>

    <button class="sync-btn" [disabled]="syncing" (click)="syncSuprides()"
            [matTooltip]="collapsed ? (syncing ? 'A sincronizar…' : 'Sync Suprides') : ''" matTooltipPosition="right">
      <mat-icon [class.spin]="syncing">sync</mat-icon>
      @if (!collapsed) {
        <span>
          @if (syncing && syncDone > 0) {
            {{ syncDone }} guardados…
          } @else if (syncing) {
            A sincronizar…
          } @else {
            Sync Suprides
          }
        </span>
      }
    </button>
  </nav>

  <div class="nav nav-bottom">
    <button class="nav-item" [class.active]="showLogs" (click)="toggleLogs()"
            [matTooltip]="collapsed ? 'Logs' : ''" matTooltipPosition="right">
      <mat-icon>list_alt</mat-icon>
      @if (!collapsed) { <span class="nav-title">Logs</span> }
    </button>
    <button class="nav-item" (click)="openPreferences()"
            [matTooltip]="collapsed ? 'Definições' : ''" matTooltipPosition="right">
      <mat-icon>settings</mat-icon>
      @if (!collapsed) { <span class="nav-title">Definições</span> }
    </button>
    <button class="nav-item" (click)="toggleCollapsed()"
            [matTooltip]="collapsed ? 'Expandir menu' : ''" matTooltipPosition="right">
      <mat-icon>{{ collapsed ? 'keyboard_double_arrow_right' : 'keyboard_double_arrow_left' }}</mat-icon>
      @if (!collapsed) { <span class="nav-title">Recolher menu</span> }
    </button>

    <button class="user-btn" [matMenuTriggerFor]="userMenu" aria-label="Conta"
            [matTooltip]="collapsed ? (auth.username() || 'Conta') : ''" matTooltipPosition="right">
      <span class="user-avatar">{{ (auth.username() || '?').charAt(0).toUpperCase() }}</span>
      @if (!collapsed) {
        <span class="nav-text">
          <span class="nav-title">{{ auth.username() }}</span>
          <span class="nav-sub store"><span class="status-dot"></span>{{ shopifyStore || '—' }} · v2.0.0</span>
        </span>
        <mat-icon class="user-more">more_vert</mat-icon>
      }
    </button>
    <mat-menu #userMenu="matMenu" xPosition="after" yPosition="above">
      <button mat-menu-item (click)="openChangePassword()"><mat-icon>key</mat-icon>Mudar palavra-passe</button>
      <button mat-menu-item (click)="logout()"><mat-icon>logout</mat-icon>Sair</button>
    </mat-menu>
  </div>
</aside>

<!-- ÁREA PRINCIPAL -->
<main class="main">
  <div class="content">
    <router-outlet></router-outlet>

    <div class="logs-sidebar" *ngIf="showLogs">
      <div class="logs-header">
        <span>Logs</span>
        <button mat-icon-button (click)="clearLogs()" matTooltip="Limpar">
          <mat-icon>delete</mat-icon>
        </button>
        <button mat-icon-button (click)="toggleLogs()" matTooltip="Fechar">
          <mat-icon>close</mat-icon>
        </button>
      </div>
      <div class="logs-body">
        <div *ngFor="let l of logs" class="log-line">{{ l }}</div>
      </div>
    </div>
  </div>
</main>
