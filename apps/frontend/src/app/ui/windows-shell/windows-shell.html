<!-- TITLEBAR -->
<div class="titlebar">
  <div class="titlebar-brand no-drag">
    <mat-icon class="brand-icon">auto_awesome</mat-icon>
    <span class="brand-name">ActiveSync<span class="brand-ai">AI</span></span>
  </div>

  <div class="menu no-drag">
    <button mat-button (click)="openSupridesMapeamento()">Coleções</button>
    <button mat-button (click)="openSupridesMargens()">Margens</button>
    <button mat-icon-button (click)="openPreferences()" matTooltip="Definições" class="btn-settings no-drag">
      <mat-icon>settings</mat-icon>
    </button>
  </div>

  <div class="window-controls no-drag">
    <button class="wc-btn" (click)="minimize()" mat-icon-button aria-label="Minimizar">
      <mat-icon>remove</mat-icon>
    </button>
    <button class="wc-btn" (click)="toggleMaximize()" mat-icon-button aria-label="Maximizar/Restaurar">
      <mat-icon>{{ maximized ? 'filter_none' : 'crop_square' }}</mat-icon>
    </button>
    <button class="wc-btn close" (click)="close()" mat-icon-button aria-label="Fechar">
      <mat-icon>close</mat-icon>
    </button>
  </div>
</div>

<!-- RIBBON -->
<div class="ribbon">
  <div class="ribbon-left">
    <button mat-raised-button class="ribbon-btn ribbon-btn--shopify" (click)="openSupridesMapeamento()">
      <mat-icon>cloud_upload</mat-icon>
      <span>COLEÇÕES SHOPIFY</span>
    </button>

    <button mat-raised-button class="ribbon-btn ribbon-btn--suprides-margins" (click)="openSupridesMargens()">
      <mat-icon>percent</mat-icon>
      <span>MARGENS B2C</span>
    </button>

    <button mat-raised-button class="ribbon-btn ribbon-btn--maptags" (click)="openFiltrosTags()">
      <mat-icon>sell</mat-icon>
      <span>GESTÃO DE TAGS</span>
    </button>

    <button mat-raised-button class="ribbon-btn ribbon-btn--sync" [disabled]="syncing" (click)="syncSuprides()">
      <mat-icon>{{ syncing ? 'hourglass_empty' : 'sync' }}</mat-icon>
      <span>
        @if (syncing && syncDone > 0) {
          {{ syncDone }} guardados…
        } @else if (syncing) {
          A SINCRONIZAR…
        } @else {
          SYNC SUPRIDES
        }
      </span>
    </button>
  </div>

  <div class="ribbon-right">
    <div class="toolbar-icons">
      <button mat-icon-button matTooltip="Mostrar logs" (click)="toggleLogs()">
        <mat-icon>list_alt</mat-icon>
      </button>
    </div>
  </div>
</div>

<!-- CONTEUDO -->
<div class="content">
  <router-outlet></router-outlet>

  <div class="logs-sidebar" *ngIf="showLogs">
    <div class="logs-header">
      <span>Logs</span>
      <button mat-icon-button (click)="clearLogs()" matTooltip="Limpar">
        <mat-icon>delete</mat-icon>
      </button>
      <button mat-icon-button (click)="toggleLogs()" matTooltip="Fechar">
        <mat-icon>close</mat-icon>
      </button>
    </div>
    <div class="logs-body">
      <div *ngFor="let l of logs" class="log-line">{{ l }}</div>
    </div>
  </div>
</div>

<!-- STATUS BAR -->
<div class="statusbar">
  <div class="statusbar-left">
    <span class="status-dot"></span>
    <span class="status-text">Loja: {{ shopifyStore || '—' }}</span>
    <span class="sep">-</span>
    <span class="status-text">v2.0.0</span>
  </div>
  <div class="statusbar-right">
    <mat-icon class="statusbar-spark">auto_awesome</mat-icon>
    <span class="statusbar-brand">ActiveSync<span class="statusbar-ai">AI</span></span>
  </div>
</div>
