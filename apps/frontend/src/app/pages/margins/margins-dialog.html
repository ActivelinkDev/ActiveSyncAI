<div class="mg-header">
  <div class="mg-header-top">
    <mat-icon class="mg-header-icon">percent</mat-icon>
    <h2>Gestão de Margens</h2>
    <button mat-icon-button (click)="fechar()" [disabled]="saving" class="mg-header-close">
      <mat-icon>close</mat-icon>
    </button>
  </div>
</div>

<div *ngIf="saving" class="progress-wrapper">
  <div class="progress-labels">
    <span>A processar alterações...</span>
    <span>{{ progress }}%</span>
  </div>
  <mat-progress-bar mode="determinate" [value]="progress"></mat-progress-bar>
</div>

<div class="margens-tree" *ngIf="!loading; else loadingTpl">
  <mat-accordion multi>
    <mat-expansion-panel
      *ngFor="let g of grupos; trackBy: trackByNome"
      (opened)="expandGrupo(g)"
    >
      <mat-expansion-panel-header>
        <mat-panel-title>{{ g.nome }}</mat-panel-title>
      </mat-expansion-panel-header>

      <div class="grupo-inputs">
        <label>% Grupo:</label>
        <input type="number" [(ngModel)]="g.PercGrupo" />
      </div>

      <mat-accordion multi>
        <mat-expansion-panel
          *ngFor="let f of g.familias; trackBy: trackByNome"
          (opened)="expandFamilia(g, f)"
        >
          <mat-expansion-panel-header>
            <mat-panel-title>{{ f.nome }}</mat-panel-title>
          </mat-expansion-panel-header>

          <div class="familia-inputs">
            <label>% Família:</label>
            <input type="number" [(ngModel)]="f.PercFam" />
          </div>

          <table mat-table [dataSource]="f.subfamilias" class="compact-table">
            <ng-container matColumnDef="sub">
              <th mat-header-cell *matHeaderCellDef>Subfamília</th>
              <td mat-cell *matCellDef="let row">{{ row.Subfamilia }}</td>
            </ng-container>

            <ng-container matColumnDef="valorSub">
              <th mat-header-cell *matHeaderCellDef>%/Valor Subfamília</th>
              <td mat-cell *matCellDef="let row">
                <input type="number" [(ngModel)]="row.ValorSubFam" />
              </td>
            </ng-container>

            <ng-container matColumnDef="tipoCalc">
              <th mat-header-cell *matHeaderCellDef>Tipo Cálculo</th>
              <td mat-cell *matCellDef="let row">
                <mat-select [(ngModel)]="row.TipoCalcPvP">
                  <mat-option value="Percentagem">Percentagem</mat-option>
                  <mat-option value="Valor">Valor Fixo</mat-option>
                </mat-select>
              </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="colunas"></tr>
            <tr mat-row *matRowDef="let row; columns: colunas"></tr>
          </table>
        </mat-expansion-panel>
      </mat-accordion>
    </mat-expansion-panel>
  </mat-accordion>
</div>

<ng-template #loadingTpl>
  <div class="loading-wrap">
    <mat-spinner diameter="36"></mat-spinner>
  </div>
</ng-template>

<div mat-dialog-actions align="end">
  <button mat-stroked-button (click)="fechar()" [disabled]="saving">Fechar</button>
  <button mat-flat-button color="primary" (click)="guardar()" [disabled]="saving">
    {{ saving ? 'A gravar...' : 'Guardar' }}
  </button>
</div>
